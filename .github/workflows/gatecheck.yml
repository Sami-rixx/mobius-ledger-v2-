name: Gatecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gatecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install all dependencies
        run: npm run install:all
      - name: Run gatecheck (build + backend tests + frontend tests + lint)
        run: npm run gatecheck
